# Local development only. Layer on top of docker-compose.yml:
#   docker network create dokploy-network        (once; the base file joins it like Dokploy does)
#   (start the local Supabase first: cd supabase-local && docker compose up -d)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# The builder and migrate containers join the local Supabase network so they reach the pooler and
# the API gateway by container name (see DATABASE_URL_INTERNAL / SUPABASE_URL_INTERNAL in .env.example).
services:
  migrate:
    networks:
      - default
      - supabase
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks:
      - default
      - dokploy-network
      - supabase

networks:
  supabase:
    external: true
    name: supabase_default
