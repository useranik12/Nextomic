# Local development only. Layer on top of docker-compose.yml:
#   docker network create dokploy-network        (once; the base file joins it like Dokploy does)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres   # DB for `bun run dev`
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build    # full stack
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
