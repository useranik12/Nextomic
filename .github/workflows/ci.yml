name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bun:
    name: Bun (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run icons:lint
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Verify builder-dependencies.json is up to date
        run: |
          bun run deps:manifest
          git diff --exit-code builder-dependencies.json

  node:
    name: Node (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test:node
