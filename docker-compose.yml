# Whole stack in one file: deploy as a single Dokploy "Compose" service (Provider: GitHub,
# Compose Path: ./docker-compose.yml, build runs on the Dokploy server).
#
# Ports: no host ports are published, so nothing can collide with other apps on the server.
# Dokploy's Traefik reaches the app over the shared external `dokploy-network`; assign the domain
# in Dokploy (Domains tab: service `app`, container port 3000). Postgres and migrate stay on the
# stack's private default network and are never exposed.
#
# Variables come from Dokploy's Environment tab (see .env.example). Locally they come from a
# root .env; see docker-compose.dev.yml.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextomic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nextomic}
    volumes:
      # Postgres 18+ images keep PGDATA in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    working_dir: /app/packages/db
    command: ["bun", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nextomic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextomic}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nextomic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextomic}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public https origin}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (openssl rand -base64 32)}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      ENCRYPTION_PREVIOUS_KEYS: ${ENCRYPTION_PREVIOUS_KEYS:-}
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/.data/storage}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Nextomic <no-reply@example.com>}
      DEV_EMAIL_TO_CONSOLE: ${DEV_EMAIL_TO_CONSOLE:-false}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - storage-data:/app/.data/storage
      - backups-data:/app/.data/backups
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  postgres-data:
  storage-data:
  backups-data:
