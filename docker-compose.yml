# The builder as one Dokploy "Compose" service (Provider: GitHub, Compose Path: ./docker-compose.yml,
# build runs on the Dokploy server). The builder keeps everything in a Supabase project (Auth, the
# nextomic_builder schema, the public users tables); there is no database in this stack.
#
# Ports: no host ports are published, so nothing can collide with other apps on the server.
# Dokploy's Traefik reaches the app over the shared external `dokploy-network`; assign the domain
# in Dokploy (Domains tab: service `app`, container port 3000).
#
# Variables come from Dokploy's Environment tab (see .env.example). Locally they come from a
# root .env; see docker-compose.dev.yml (it also joins the local Supabase network).
services:
  # migrate reuses the image that app builds (one build, one export, not two). It applies the SQL
  # migrations to the Supabase database through a SESSION-mode connection (never the transaction pooler).
  migrate:
    image: nextomic-builder:latest
    pull_policy: never
    restart: "no"
    working_dir: /app/packages/db
    command: ["bun", "run", "migrate"]
    networks:
      - default
      - dokploy-network
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-${DATABASE_URL:?set DATABASE_URL (Supabase pooler, session mode)}}

  app:
    image: nextomic-builder:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-${DATABASE_URL:?set DATABASE_URL (Supabase pooler, session mode)}}
      # Server-side address of the Supabase API gateway and its publishable key. The browser never
      # talks to Supabase: sign-in runs on the server and sessions live in httpOnly cookies.
      SUPABASE_URL: ${SUPABASE_URL_INTERNAL:-${SUPABASE_URL:?set SUPABASE_URL}}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY}
      # The builder's public address (no path): links in auth emails and secure cookies.
      APP_URL: ${APP_URL:?set APP_URL to the public origin}
      # basic | medium | strong | very-strong (see .env.example)
      AUTH_PASSWORD_POLICY: ${AUTH_PASSWORD_POLICY:-medium}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (openssl rand -base64 32)}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      ENCRYPTION_PREVIOUS_KEYS: ${ENCRYPTION_PREVIOUS_KEYS:-}
      # Files live in Supabase Storage (buckets are created by the database migrations). The secret
      # key stays on the server and bypasses Storage policies; never expose it to the browser.
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?set SUPABASE_SECRET_KEY}
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-supabase}
      STORAGE_LOCAL_ROOT: /app/.data/storage
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - storage-data:/app/.data/storage
      - backups-data:/app/.data/backups
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  storage-data:
  backups-data:
